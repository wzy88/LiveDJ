services:
  - type: web
    name: claudio-radio-web-wzy88-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_ORIGIN
        value: https://claudio-radio-web.vercel.app
